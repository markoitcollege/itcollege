    <style>
        body {
            background: #ffffff;
            padding: 2rem 0;
        }

        /* Стилі блоку #featured_container */
        #featured_container {
            background: #C2C2C2;
        }

        #featured_container:before {
            display: block;
            width: 100%;
            content: "";
            height: 2px;
            background-image: -webkit-gradient(linear, left bottom, right bottom, color-stop(0%, #979797), color-stop(50%, #C2C2C2), color-stop(100%, #979797));
        }

        #featured_container a:link,
        #featured_container a:visited,
        #featured_container a:hover,
        #featured_container a:active {
            color: #fff;
            text-decoration: none;
            transition: color 3s ease-out;
        }

        #featured_container a:link img,
        #featured_container a:visited img {
            opacity: 0.85;
            transition: opacity 1s ease-out;
        }

        #featured_container a:hover img,
        #featured_container a:active img {
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        #featured_container .col-sm-6 div {
            position: relative;
            margin-bottom: 3rem;
        }

        #featured_container h2 {
            position: absolute;
            bottom: 0;
            left: 0;
            margin: 0;
            padding: 30px;
            border-bottom: 2px solid #fff;
            font-size: 2rem;
            font-family: 'Roboto Condensed', sans-serif;
            font-style: normal;
            font-weight: normal;
        }

        #featured_container .shadow_featured {
            position: absolute !important;
            margin-bottom: 0 !important;
            bottom: 0;
            left: 0;
            min-height: 75%;
            width: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85));
        }

        #featured_container a:link .shadow_featured,
        #featured_container a:visited .shadow_featured {
            opacity: 1;
            filter: alpha(opacity=100);
            transition: opacity 2s ease-out;
        }

        #featured_container a:hover .shadow_featured,
        #featured_container a:active .shadow_featured {
            opacity: 0.1;
            filter: alpha(opacity=10);
            transition: opacity 2s ease-out;
        }

        #featured_container a:link h2 span,
        #featured_container a:visited h2 span {
            background: #252775;
            transition: background 2s ease-out;
        }

        #featured_container a:hover h2 span,
        #featured_container a:active h2 span {
            background: #00A1E4;
            transition: background 2s ease-out;
        }

        .block-views-blockfront-page-news-block-2 {
            margin-top: 3rem;
        }

        @media only screen and (min-width: 480px) {
            #featured_container h2 {
                font-size: 3rem;
            }
        }

        @media only screen and (min-width: 768px) {
            #featured_container h2 {
                font-size: 2rem;
            }
        }

        @media only screen and (min-width: 992px) {
            #featured_container h2 {
                font-size: 2.4rem;
            }
        }

        @media only screen and (min-width: 1200px) {
            #featured_container h2 {
                font-size: 3rem;
            }
        }
    </style>
</head>
