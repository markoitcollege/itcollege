<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petworld</title>
    
    <!-- Підключення шрифтів та стилів -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Шапка (Header / Top Bar 1280px) -->
  <header class="header">
    <div class="container header-container">
      <a href="#" class="logo">
        <img src="images/logo.svg" alt="Petworld logo" class="logo-img">
      </a>
<div class="auth-buttons">
    <a href="../lab2/index.html" class="btn-sign-up">Sign Up</a>
    <a href="../lab2/index.html" class="btn-log-in">Log in</a>
</div>
    </div>
  </header>

  <!-- Головна секція (Header 1280px / Hero) -->
  <section class="hero-section">
    <div class="container hero-container">
      <div class="hero-content">
        <div class="hero-text-block">
          <h1 class="hero-title">Pet Store<br>& Beyond</h1>
          <p class="hero-text">
            This is a sample landing page, created with Figma and Anima. No coding involved.
          </p>
        </div>
        <a href="#" class="btn-get-started">Get Started</a>
      </div>
      <div class="hero-image-wrapper">
        <img src="images/dogs.png" alt="Two dogs in stylish outfits" class="hero-img">
      </div>
    </div>
  </section>

  <!-- Секція Відео (Video 1280px) -->
  <section class="video-section">
    <div class="video-container">
      <div class="video-wrapper">
        <img src="images/video.png" alt="Video preview" class="video-img">
      </div>
    </div>
  </section>

</body>
</html>
